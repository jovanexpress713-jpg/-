name: Production Security Gate

on:
  push:
    branches: [main, 'fix/**']
  pull_request:
    branches: [main]

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Run production security regression
        run: npx tsx tests/productionSecurity.test.ts
