name: EJAZ CI
on:
  push:
    branches:
      - main
      - "audit/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Tests, TypeScript, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run test suite
        run: npm test
      - name: Type-check
        run: npm run lint
      - name: Build production assets
        run: npm run build
